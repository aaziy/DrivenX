  '@node-rs/argon2': ^2.2.0
  '@playwright/test': ^1.55.0
  '@prisma/client': ^6.16.2
  '@types/node': ^22.18.1
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitest/coverage-v8': ^3.2.4
  eslint: ^9.36.0
  next: ^15.5.4
  next-auth: ^4.24.11
  prettier: ^3.6.2
  prisma: ^6.16.2
  react: ^19.2.0
  react-dom: ^19.2.0
  typescript: ^5.9.2
  typescript-eslint: ^8.44.0
  vitest: ^3.2.4
  zod: ^3.25.76

# Explicit allowlist of packages permitted to run install scripts.
