name: drivenx

services:
  postgres:
    image: postgres:16-alpine
    container_name: drivenx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drivenx
      POSTGRES_PASSWORD: drivenx_dev
      POSTGRES_DB: drivenx
      # Deterministic collation so ORDER BY matches production regardless of host locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      # Host port 5433, not 5432: this machine already runs a native Postgres bound to
      # 127.0.0.1:5432. Docker publishes on the wildcard, so `localhost` would resolve
      # to the native instance first and connections would silently hit the wrong
      # database. 5433 keeps the two entirely separate.
      - "5433:5432"
    volumes:
      - drivenx-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivenx -d drivenx"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: drivenx-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: drivenx
      MINIO_ROOT_PASSWORD: drivenx_dev_secret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - drivenx-minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot: creates the documents bucket, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: drivenx-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 drivenx drivenx_dev_secret &&
      mc mb --ignore-existing local/drivenx-documents &&
      mc anonymous set none local/drivenx-documents &&
      echo 'bucket ready';
      "

volumes:
  drivenx-pgdata:
  drivenx-minio:
