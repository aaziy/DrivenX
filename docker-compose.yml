name: drivenx

services:
  postgres:
    image: postgres:16-alpine
    container_name: drivenx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: drivenx
      POSTGRES_PASSWORD: drivenx_dev
      POSTGRES_DB: drivenx
      # Deterministic collation so ORDER BY matches production regardless of host locale.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      # Host port 5433, not 5432: this machine already runs a native Postgres bound to
      # 127.0.0.1:5432. Docker publishes on the wildcard, so `localhost` would resolve
      # to the native instance first and connections would silently hit the wrong
      # database. 5433 keeps the two entirely separate.
      - "5433:5432"
    volumes:
      - drivenx-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drivenx -d drivenx"]
      interval: 5s
      timeout: 5s
      retries: 12

  # S3-compatible document storage for development and CI.
  #
  # RustFS rather than MinIO: Docker Hub stopped serving the minio/minio and minio/mc
  # images. CI failed on every push because a fresh runner could not pull them, while
  # machines with a cached copy kept working and hid the problem. The tag is pinned, so
  # an upstream change cannot break the build without a deliberate bump in this file.
  #
  # The bucket is created by `pnpm storage:ensure-bucket`, which waits for this service
  # to start answering, so no health check or init container is needed.
  #
  # Production storage is a separate, still-open decision. The application talks to any
  # S3-compatible service through packages/storage.
  s3:
    image: rustfs/rustfs:1.0.0-rc.6
    container_name: drivenx-s3
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: drivenx
      RUSTFS_SECRET_KEY: drivenx_dev_secret
    ports:
      # Only the S3 API is published; nothing in this project uses RustFS's other ports.
      - "9000:9000"
    volumes:
      - drivenx-s3data:/data

volumes:
  drivenx-pgdata:
  drivenx-s3data:
